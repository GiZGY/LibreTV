services:
  openstream:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
    image: openstream:local
    container_name: openstream
    ports:
      - "8899:8080"
    environment:
      PASSWORD: ${PASSWORD:?请先设置 PASSWORD}
      TVBOX_BRIDGE_URL: ${TVBOX_BRIDGE_URL:-}
      TVBOX_BRIDGE_TOKEN: ${TVBOX_BRIDGE_TOKEN:-}
      TVBOX_BRIDGE_TIMEOUT_MS: ${TVBOX_BRIDGE_TIMEOUT_MS:-8000}
      TVBOX_BRIDGE_MAX_INFLIGHT: ${TVBOX_BRIDGE_MAX_INFLIGHT:-48}
      TVBOX_BRIDGE_MAX_RESPONSE_BYTES: ${TVBOX_BRIDGE_MAX_RESPONSE_BYTES:-2097152}
    restart: unless-stopped
