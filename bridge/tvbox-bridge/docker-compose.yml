services:
  tvbox-bridge:
    build:
      context: .
      labels:
        openstream.project: tvbox-bridge
    image: openstream-tvbox-bridge:latest
    container_name: openstream-tvbox-bridge
    restart: unless-stopped
    environment:
      PORT: "9979"
      TVBOX_BRIDGE_TOKEN: ${TVBOX_BRIDGE_TOKEN:?TVBOX_BRIDGE_TOKEN is required}
      BRIDGE_VERSION: ${BRIDGE_VERSION:-0.1.0}
    ports:
      - "127.0.0.1:9979:9979"
    labels:
      openstream.project: tvbox-bridge
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:9979/api/tvbox/health',{headers:{Authorization:'Bearer '+process.env.TVBOX_BRIDGE_TOKEN}}).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
