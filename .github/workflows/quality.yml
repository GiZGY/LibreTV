name: Quality gates

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            bridge/tvbox-bridge/package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Build and verify root application
        run: npm run quality

      - name: Verify new UI production build
        run: npm run quality:new-ui && npm run smoke:native-ads

      - name: Cache media acceptance browsers
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install media acceptance runtime
        timeout-minutes: 5
        run: |
          printf '%s\n' 'https://archive.ubuntu.com/ubuntu/' | sudo tee /etc/apt/apt-mirrors.txt >/dev/null
          if [ -f /etc/apt/apt-security-mirrors.txt ]; then
            printf '%s\n' 'https://security.ubuntu.com/ubuntu/' | sudo tee /etc/apt/apt-security-mirrors.txt >/dev/null
          fi
          printf '%s\n' 'Acquire::Retries "1";' 'Acquire::http::Timeout "30";' 'Acquire::https::Timeout "30";' | sudo tee /etc/apt/apt.conf.d/80-openstream-timeouts >/dev/null
          npx playwright install --with-deps chromium webkit
          command -v ffmpeg || (sudo apt-get update && sudo apt-get install -y ffmpeg)

      - name: Real media browser regression
        run: npm run test:browser -- --no-build

      - name: Retain failing synthetic media trace
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: synthetic-browser-failure
          path: test-results/
          if-no-files-found: ignore
          retention-days: 3

      - name: Verify catalogue database and incremental refresh
        run: npm run test:catalog-index

      - name: Install bridge dependencies
        working-directory: bridge/tvbox-bridge
        run: npm ci

      - name: Audit and verify bridge
        working-directory: bridge/tvbox-bridge
        run: |
          npm audit --audit-level=high
          npm run smoke:ci

      - name: Build bridge container
        run: docker build --tag openstream-tvbox-bridge:quality bridge/tvbox-bridge

      - name: Validate and build ad observer
        run: |
          docker compose -f services/ad-observer/compose.yml config -q
          docker build --tag openstream-ad-observer:quality -f services/ad-observer/Dockerfile .
          docker run --rm openstream-ad-observer:quality node services/ad-observer/worker.mjs --help

      - name: Validate and build OpenStream container
        env:
          PASSWORD: quality-check-only
        run: |
          docker compose -f deploy/docker/docker-compose.yml config -q
          docker build --tag openstream:quality -f deploy/docker/Dockerfile .
