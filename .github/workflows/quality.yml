name: Quality gates

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            bridge/tvbox-bridge/package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Build and verify root application
        run: npm run quality

      - name: Install bridge dependencies
        working-directory: bridge/tvbox-bridge
        run: npm ci

      - name: Audit and verify bridge
        working-directory: bridge/tvbox-bridge
        run: |
          npm audit --audit-level=high
          npm run smoke:ci

      - name: Build bridge container
        run: docker build --tag openstream-tvbox-bridge:quality bridge/tvbox-bridge

      - name: Validate and build ad observer
        run: |
          docker compose -f services/ad-observer/compose.yml config -q
          docker build --tag openstream-ad-observer:quality -f services/ad-observer/Dockerfile .
          docker run --rm openstream-ad-observer:quality node services/ad-observer/worker.mjs --help

      - name: Validate and build OpenStream container
        env:
          PASSWORD: quality-check-only
        run: |
          docker compose -f deploy/docker/docker-compose.yml config -q
          docker build --tag openstream:quality -f deploy/docker/Dockerfile .
